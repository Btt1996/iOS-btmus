name: Btt Music iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build React app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS archive
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Using Xcode workspace"
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/BttMusic.xcarchive" \
              archive \
              CODE_SIGNING_ALLOWED=NO
          elif [ -d "ios/App/App.xcodeproj" ]; then
            echo "Using Xcode project (Swift Package Manager)"
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/BttMusic.xcarchive" \
              archive \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "ERROR: No Xcode workspace or project found"
            find ios -maxdepth 4 -type d
            exit 1
          fi
      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/BttMusic.xcarchive/Products/Applications/App.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r BttMusic-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BttMusic-iOS-unsigned
          path: ${{ runner.temp }}/BttMusic-unsigned.ipa
          retention-days: 7
